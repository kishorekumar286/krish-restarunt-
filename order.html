<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRISH - Order</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2 class="logo">KRISH</h2>

    <div class="nav-links">
        <a href="index.html">HOME</a>
        <a href="menu.html">MENU</a>
        <a href="about.html">ABOUT</a>
        <a href="branches.html">BRANCHES</a>
        <a href="contact.html">CONTACT</a>
    </div>
</nav>

<section class="page">

    <p class="small-title">ORDER FOOD</p>

    <h1>Place Your Order</h1>

    <div class="order-box">

        <form>

            <label>Your Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number">

            <label>Select Dish</label>

            <select>
                <option>Masala Dosa - ₹90</option>
                <option>Idli - ₹60</option>
                <option>Medu Vada - ₹70</option>
                <option>Plain Dosa - ₹70</option>
                <option>Paneer Dosa - ₹130</option>
                <option>Onion Dosa - ₹90</option>
                <option>South Indian Meals - ₹150</option>
                <option>Curd Rice - ₹80</option>
                <option>Lemon Rice - ₹80</option>
                <option>Veg Biryani - ₹140</option>
                <option>Paneer Fried Rice - ₹160</option>
                <option>Filter Coffee - ₹40</option>
            </select>

            <label>Quantity</label>
            <input type="number" min="1" value="1">

            <label>Delivery / Branch</label>

            <select>
                <option>Trichy</option>
                <option>Chennai</option>
                <option>Coimbatore</option>
                <option>Madurai</option>
                <option>Salem</option>
                <option>Tirunelveli</option>
                <option>Thanjavur</option>
            </select>

            <label>Address</label>
            <textarea placeholder="Enter your address"></textarea>

            <button type="submit">PLACE ORDER</button>

        </form>

    </div>

</section>

<footer>
    <h2>KRISH</h2>
    <p>Contact: 9876543210</p>
</footer>

</body>
</html>
